<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Reset Password | Student Placement Predictor
    </title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/auth.css') }}"
    >

</head>


<body>


<div class="auth-page">


    <div class="auth-card">


        <div class="auth-heading">

            <h2>
                Reset Password
            </h2>

            <p>
                Create your new password.
            </p>

        </div>


        <form method="POST">


            <div class="form-group">

                <label>
                    New Password
                </label>

                <input
                    type="password"
                    name="password"
                    minlength="6"
                    required
                >

            </div>


            <div class="form-group">

                <label>
                    Confirm Password
                </label>

                <input
                    type="password"
                    name="confirm_password"
                    minlength="6"
                    required
                >

            </div>


            <button
                type="submit"
                class="auth-button"
            >
                Reset Password
            </button>


        </form>


        <div class="auth-footer">

            <a
                href="{{ url_for('auth.login') }}"
            >
                ← Back to Login
            </a>

        </div>


    </div>


</div>


</body>

</html>
