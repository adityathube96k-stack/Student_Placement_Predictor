<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Forgot Password | Student Placement Predictor
    </title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/auth.css') }}"
    >

</head>


<body>


<div class="auth-page">


    <div class="auth-card">


        <div class="auth-heading">

            <h2>
                Forgot Password?
            </h2>

            <p>
                Enter your registered email address.
            </p>

        </div>


        {% with messages =
            get_flashed_messages(
                with_categories=true
            )
        %}

            {% if messages %}

                {% for category, message in messages %}

                    <div
                        class="alert alert-{{ category }}"
                    >
                        {{ message }}
                    </div>

                {% endfor %}

            {% endif %}

        {% endwith %}


        <form method="POST">


            <div class="form-group">

                <label>
                    Email Address
                </label>

                <input
                    type="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                >

            </div>


            <button
                type="submit"
                class="auth-button"
            >
                Continue
            </button>


        </form>


        <div class="auth-footer">

            Remember your password?

            <a
                href="{{ url_for('auth.login') }}"
            >
                Login
            </a>

        </div>


    </div>


</div>


</body>

</html>
