<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Placement Prediction</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/prediction.css') }}">
</head>

<body>

    <div class="prediction-container">

        <div class="prediction-card">

            <div class="prediction-header">

                <h1>Placement Prediction</h1>

                <p>
                    Enter your academic and skill information
                    to predict your placement probability.
                </p>

            </div>


            <!-- Flash Messages -->

            {% with messages = get_flashed_messages(with_categories=true) %}

                {% if messages %}

                    {% for category, message in messages %}

                        <div class="alert {{ category }}">
                            {{ message }}
                        </div>

                    {% endfor %}

                {% endif %}

            {% endwith %}


            <!-- Prediction Form -->

            <form method="POST"
                  action="{{ url_for('prediction.prediction') }}">


                <!-- CGPA -->

                <div class="form-group">

                    <label for="cgpa">
                        CGPA
                    </label>

                    <input
                        type="number"
                        id="cgpa"
                        name="cgpa"
                        min="0"
                        max="10"
                        step="0.01"
                        placeholder="Enter CGPA (0 - 10)"
                        required
                    >

                </div>


                <!-- Attendance -->

                <div class="form-group">

                    <label for="attendance">
                        Attendance (%)
                    </label>

                    <input
                        type="number"
                        id="attendance"
                        name="attendance"
                        min="0"
                        max="100"
                        step="0.01"
                        placeholder="Enter attendance percentage"
                        required
                    >

                </div>


                <!-- Aptitude -->

                <div class="form-group">

                    <label for="aptitude_score">
                        Aptitude Score
                    </label>

                    <input
                        type="number"
                        id="aptitude_score"
                        name="aptitude_score"
                        min="0"
                        max="100"
                        step="0.01"
                        placeholder="Enter aptitude score"
                        required
                    >

                </div>


                <!-- Coding -->

                <div class="form-group">

                    <label for="coding_score">
                        Coding Score
                    </label>

                    <input
                        type="number"
                        id="coding_score"
                        name="coding_score"
                        min="0"
                        max="100"
                        step="0.01"
                        placeholder="Enter coding score"
                        required
                    >

                </div>


                <!-- Communication -->

                <div class="form-group">

                    <label for="communication_score">
                        Communication Score
                    </label>

                    <input
                        type="number"
                        id="communication_score"
                        name="communication_score"
                        min="0"
                        max="100"
                        step="0.01"
                        placeholder="Enter communication score"
                        required
                    >

                </div>


                <!-- Technical -->

                <div class="form-group">

                    <label for="technical_score">
                        Technical Score
                    </label>

                    <input
                        type="number"
                        id="technical_score"
                        name="technical_score"
                        min="0"
                        max="100"
                        step="0.01"
                        placeholder="Enter technical score"
                        required
                    >

                </div>


                <!-- Submit -->

                <button
                    type="submit"
                    class="prediction-button">

                    Predict Placement

                </button>

            </form>


            <!-- Back to Dashboard -->

            <div class="back-link">

                <a href="{{ url_for('dashboard.dashboard') }}">
                    ← Back to Dashboard
                </a>

            </div>

        </div>

    </div>

</body>
</html>
