{% extends "layouts/public.html" %}
{% from "partials/_macros.html" import icon %}
{% block title %}{{ title }} · {{ app_name }}{% endblock %}
{% block content %}
<section class="error-page">
  <div class="error-page__code serif">{{ code }}</div>
  <h1>{{ title }}</h1>
  <p class="muted">{{ message }}</p>
  <div class="row mt-6" style="justify-content:center">
    <a class="btn btn--primary" href="{{ url_for('main.index') }}">Go to home</a>
    <a class="btn btn--secondary" href="javascript:history.back()">Go back</a>
  </div>
</section>
{% endblock %}
